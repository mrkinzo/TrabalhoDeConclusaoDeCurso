<!-- Black header -->
<header class="site-header">
  <h1 class="display-5">crie sua conta</h1>
  <p>cadastre-se para acompanhar e contribuir com o acervo.</p>
</header>

<!-- Main content -->
<!-- Main content -->
<main class="auth-section">
  <div class="auth-card">
    <h2>Registrar</h2>
    <p class="auth-subtitle">Preencha os campos abaixo para criar sua conta.</p>

    <!-- 1. Adicionado o id="registerForm" -->
    <form id="registerForm">
      <div class="mb-3">
        <label for="registroNome" class="form-label">Nome completo</label>
        <input type="text" class="form-control" id="registroNome" placeholder="Seu nome" required>
      </div>

      <div class="mb-3">
        <label for="registroEmail" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="registroEmail" placeholder="seuemail@exemplo.com" required>
      </div>

      <div class="mb-3">
        <label for="registroSenha" class="form-label">Senha</label>
        <input type="password" class="form-control" id="registroSenha" placeholder="Crie uma senha" required>
      </div>

      <!-- 2. Corrigido o ID para "professor" -->
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="professor">
        <label class="form-check-label" for="professor" style="font-size: 0.85rem;">
         Sou professor
        </label>
      </div>

      <!-- 2. Corrigido o ID para "redator" -->
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="redator">
        <label class="form-check-label" for="redator" style="font-size: 0.85rem;">
         Desejo ser um redator do acervo.
        </label>
      </div>

      <button type="submit" class="btn btn-dark w-100">Criar conta</button>
    </form>

    <p class="auth-switch">Já tem conta? <a href="login.html">Entrar</a></p>
  </div>
</main>
