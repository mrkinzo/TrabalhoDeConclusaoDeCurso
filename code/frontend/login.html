<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="style.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container">
    <a class="navbar-brand" href="#">STUDIO</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-end" id="navMenu">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="IndexHome.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="index.html">Rochas</a></li>
        <li class="nav-item"><a class="nav-link" href="indexMin.html">Minerais</a></li>
        <li class="nav-item"><a class="nav-link" href="IndexAbout.html">Sobre o site</a></li>
        <li class="nav-item ms-lg-2"><a class="btn btn-outline-dark btn-sm active" href="login.html">Login</a></li>
        <li class="nav-item ms-lg-2"><a class="btn btn-dark btn-sm" href="registro.html">Registrar</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Black header -->
<header class="site-header">
  <h1 class="display-5">bem-vindo de volta</h1>
  <p>entre com sua conta para acessar o acervo.</p>
</header>

<!-- Main content -->
<main class="auth-section">
  <div class="auth-card">
    <h2>Entrar</h2>
    <p class="auth-subtitle">Informe seus dados para acessar sua conta.</p>

    <form>
      <div class="mb-3">
        <label for="loginEmail" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="loginEmail" placeholder="seuemail@exemplo.com" required>
      </div>

      <div class="mb-2">
        <label for="loginSenha" class="form-label">Senha</label>
        <input type="password" class="form-control" id="loginSenha" placeholder="Sua senha" required>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="lembrar">
          <label class="form-check-label" for="lembrar" style="font-size: 0.85rem;">
            Lembrar de mim
          </label>
        </div>
        <a href="#" style="font-size: 0.85rem; color: #6c757d;">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn btn-dark w-100">Entrar</button>
    </form>

    <p class="auth-switch">Ainda não tem conta? <a href="registro.html">Registre-se</a></p>
  </div>
</main>

<footer>
  &copy; 2026 Studio. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
