                href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
                rel="stylesheet">
            <link href="style.css" rel="stylesheet">
        </head>
        <body>

            <!-- Navbar -->
            <nav class="navbar navbar-expand-lg sticky-top">
                <div class="container">
                    <a class="navbar-brand" href="IndexHome.html">STUDIO</a>
                    <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse" data-bs-target="#navMenu">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse justify-content-end"
                        id="navMenu">
                        <ul class="navbar-nav align-items-center" id="authMenu">
                            <li class="nav-item"><a class="nav-link"

                            <li class="nav-item"><a class="nav-link"

                            <!-- OS BOTÕES SERÃO INJETADOS AQUI AUTOMATICAMENTE PELO JAVASCRIPT -->
                        </ul>
                    </div>
                </nav>

                <!-- Conteúdo da Página do Usuário -->
                <main class="container my-5" style="max-width: 600px;">
                    <div class="card shadow-sm p-4">
                        <h2 class="mb-4">Meu Perfil</h2>

                        <div class="mb-3">
                            <label class="form-label text-muted">Nome de
                                Usuário</label>
                            <p id="perfilNome"
                                class="fs-5 fw-bold">Carregando...</p>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted">E-mail</label>
                            <p id="perfilEmail"
                                class="fs-5 fw-bold">Carregando...</p>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-muted">Cargos /
                                Permissões</label>
                            <div id="perfilCargos">
                                <!-- Os badges dos cargos entram aqui -->
                            </div>
                        </div>

                        <hr class="my-4">

                        <button id="btnDeslogar" class="btn btn-danger w-100">Sair
                            da conta (Logout)</button>
                    </div>
                </main>

                <footer class="text-center py-4">
                    &copy; 2026 Studio. All rights reserved.
                </footer>

                <script
                    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
                <script src="auth.js"></script>
                <script>
        // Lógica específica da página de perfil
        document.addEventListener("DOMContentLoaded", async function() {
            const usuarioId = localStorage.getItem('usuarioId');

            // Se o usuário não estiver logado, manda ele de volta pro login
            if (!usuarioId) {
                alert('Você precisa estar logado para ver esta página.');
                window.location.href = "login.html";
                return;
            }

            let usuarioLogado;
            try {
                const response = await fetch(`http://localhost:3000/api/usuario/${usuarioId}`);
                const data = await response.json();

                if (!data.sucesso) {
                    // ID salvo não existe mais no banco
                    localStorage.removeItem('usuarioId');
                    alert('Sua sessão expirou. Faça login novamente.');
                    window.location.href = "login.html";
                    return;
                }

                usuarioLogado = data.usuario;
            } catch (erro) {
                console.error('Erro ao buscar dados do usuário:', erro);
                alert('Não foi possível conectar ao servidor.');
                return;
            }

            // Preenche os dados na tela (sempre vindos direto do banco)
            document.getElementById('perfilNome').innerText = usuarioLogado.nome;
            document.getElementById('perfilEmail').innerText = usuarioLogado.email;

            // Monta os cargos visualmente
            const containerCargos = document.getElementById('perfilCargos');
            let htmlCargos = '';

            if (usuarioLogado.isAdmin) htmlCargos += '<span class="badge bg-danger me-2">Administrador</span>';
            if (usuarioLogado.isProfessor) htmlCargos += '<span class="badge bg-secondary me-2">Professor</span>';
            if (usuarioLogado.isRedator) htmlCargos += '<span class="badge bg-secondary me-2">Redator</span>';
            
            if (!htmlCargos) {
                htmlCargos = '<span class="text-muted">Usuário padrão</span>';
            }
            containerCargos.innerHTML = htmlCargos;

            // Ação do botão de deslogar nesta página
            document.getElementById('btnDeslogar').addEventListener('click', function() {
                localStorage.removeItem('usuarioId');
                alert('Você saiu da sua conta com sucesso.');
                window.location.href = "login.html";
            });
        });
    </script>
            </body>
        </html>
